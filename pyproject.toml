[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dupefind"
version = "0.1.0"
description = "Fast, zero-dependency duplicate file finder"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["duplicates", "cli", "disk-space", "cleanup"]

[project.scripts]
dupefind = "dupefind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
